<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 满幅深色底：iOS/Android 会自己套圆角蒙版，所以不留透明圆角 -->
  <rect x="0" y="0" width="1024" height="1024" fill="#0E0F12"/>
  <!-- 极淡的中心辉光，避免大面积死黑 -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#1D3242" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0E0F12" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#glow)"/>

  <!-- 显示器：粗圆角描边，小尺寸下也能读出来 -->
  <rect x="150" y="286" width="560" height="356" rx="48" ry="48"
        fill="none" stroke="#8CE68C" stroke-width="62"/>

  <!-- 支架 + 底座 -->
  <path d="M430 642 V716" fill="none" stroke="#8CE68C" stroke-width="62" stroke-linecap="round"/>
  <path d="M312 742 H548" fill="none" stroke="#8CE68C" stroke-width="62" stroke-linecap="round"/>

  <!-- 手机：右下角，深色填充盖住显示器边缘，形成"从手机看电脑"的重叠关系 -->
  <rect x="612" y="500" width="252" height="392" rx="60" ry="60"
        fill="#0E0F12" stroke="#8CE68C" stroke-width="62"/>
  <!-- 听筒短线，让它在小尺寸下也像个手机 -->
  <path d="M700 566 H776" fill="none" stroke="#8CE68C" stroke-width="40" stroke-linecap="round" opacity="0.85"/>
</svg>
